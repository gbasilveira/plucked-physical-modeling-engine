# SPDX-License-Identifier: MIT
name: "TEMPORARY bootstrap build (owned by P0.1; P0.2 deletes it when pr.yml lands)"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  presets:
    name: ${{ matrix.system }}-${{ matrix.config }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        system: [linux, macos, windows]
        config: [debug, release, rt-safety, asan, tsan, coverage]
        include:
          - system: linux
            runner: ubuntu-latest
          - system: macos
            runner: macos-latest
          - system: windows
            runner: windows-latest
        exclude:
          # ADR-0004 (Proposed): no ThreadSanitizer on Windows, hence no windows-tsan preset.
          - system: windows
            config: tsan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/dependencies.cmake') }}
      - name: Install Ninja (Linux)
        if: matrix.system == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja (macOS)
        if: matrix.system == 'macos'
        run: brew install ninja
      - name: Visual Studio developer shell (Windows, MSVC)
        if: matrix.system == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Configure
        shell: bash
        run: cmake --preset ${{ matrix.system }}-${{ matrix.config }}
      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.system }}-${{ matrix.config }}
      - name: Test
        shell: bash
        run: ctest --preset ${{ matrix.system }}-${{ matrix.config }}

  deps:
    name: every dependency pin resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-all-${{ runner.os }}-${{ hashFiles('cmake/dependencies.cmake') }}
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure with every dependency
        run: cmake --preset linux-release -DPME_FETCH_ALL_DEPS=ON

  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pytest
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run python tools/check_spdx.py
